name: Keep Supabase Alive

on:
  schedule:
    # Every Monday at 09:00 UTC. Supabase free-tier projects pause after
    # ~7 days of no API activity, so a weekly ping keeps this one awake.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/keep-supabase-alive.js
